<!DOCTYPE html>

    .snap-x {

    .snap-mandatory {

    }

    .snap-center {
      scroll-snap-align: center;
    }

    .object-cover {
      object-fit: cover;
    }

    .block {
      display: block;
    }

    .space-y-6 > * + * {
      margin-top: 1.5rem;
    }

    .active\:scale-95:active {
      transform: scale(0.95);
    }

    .active\:brightness-90:active {
      filter: brightness(0.9);
    }

    .hover\:ring-2:hover {
      box-shadow: 0 0 0 2px currentColor;
    }

    .hover\:border-brand-orange:hover {
      border-color: var(--brand-orange);
    }

    .transition-all {
      transition: all 180ms ease;
    }

    .transition-colors {
      transition: border-color 180ms ease, color 180ms ease;
    }

    .transition-transform {
      transition: transform 180ms ease;
    }

    .-translate-x-1\/2 {
      transform: translateX(-50%);
    }

    .opacity-40 {
      opacity: 0.4;
    }

    .grayscale {
      filter: grayscale(1);
    }

    .pointer-events-none {
      pointer-events: none;
    }

    .h-16 {
      height: 4rem;
    }

    .max-w-app {
      max-width: 980px;
      margin: 0 auto;
    }

    .backdrop-layer {
      filter: blur(1.5px);
    }

    .bg-trigger-wrap {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 10;
    }

    .bg-trigger {
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #f1b457 0%, #e55341 100%);
      color: #fff;
      font-family: "Public Sans", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      min-height: 40px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .bg-trigger:active {
      transform: scale(0.98);
    }

    .bg-trigger:hover {
      filter: brightness(1.03);
    }

    .modal-layer {
      opacity: 0;
      pointer-events: none;
      transition: opacity 400ms ease-out;
    }

    .sheet {
      transform: translateY(100%);
      transition: transform 400ms ease-out;
      margin: 0 auto;
      max-width: 980px;
    }

    .modal-layer.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-layer.is-open .sheet {
      transform: translateY(0);
    }

    .close-btn,
    .color-btn,
    .size-btn,
    .cta-btn {
      cursor: pointer;
    }

    .close-btn {
      border: 0;
    }

    .color-btn,
    .size-btn {
      background-clip: padding-box;
    }

    .size-btn {
      background: #fff;
    }

    .cta-btn {
      border: 0;
      background: linear-gradient(90deg, #f1b457 0%, #e55341 100%);
      font-size: 1.55rem;
    }

    @media (min-width: 768px) {
      body {
        min-height: 100dvh;
      }

      .h-\[795px\] {
        height: min(820px, calc(100dvh - 28px));
      }

      .sheet {
        width: min(980px, 100%);
      }
    }

</head>
<body class="bg-stone-100 font-body text-stone-900">

    </header>
    <div class="p-4 grid grid-cols-2 gap-4 max-w-app">
      <div class="aspect-[3/4] bg-white rounded-xl shadow-sm"></div>
      <div class="aspect-[3/4] bg-white rounded-xl shadow-sm"></div>
      <div class="aspect-[3/4] bg-white rounded-xl shadow-sm"></div>
      <div class="aspect-[3/4] bg-white rounded-xl shadow-sm"></div>

  <div class="fixed inset-0 bg-black/60 z-[60] flex items-end modal-layer" id="modalOverlay" aria-hidden="true">
    <div class="bg-white w-full h-[795px] rounded-t-[32px] overflow-hidden flex flex-col relative shadow-2xl sheet" role="dialog" aria-modal="true" aria-label="Detalhes do produto">
      <div class="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-stone-300 rounded-full z-[70]"></div>

            </div>
          </div>
        </div>
        <div class="px-6 pb-32">
          <div class="flex justify-between items-start mb-2">
            <h1 class="font-headline text-4xl tracking-wide text-stone-900 leading-none">CAMISETA ESSENCIAL HORIZONTE</h1>
          </div>
          <p class="text-brand-orange font-bold text-3xl mb-4 tracking-tight">R$ 89,90</p>
          <div class="space-y-6">

              <h3 class="font-bold text-xs uppercase tracking-widest text-stone-400 mb-2">Sobre o Produto</h3>

                <button class="flex-1 py-3 rounded-lg border-2 border-brand-orange text-brand-orange font-bold size-btn" type="button">M</button>

        <button class="w-full bg-brand-orange text-white font-headline text-2xl tracking-widest py-5 active:brightness-90 transition-all cta-btn" type="button">
          ADICIONAR AO CARRINHO
        </button>
      </div>
    </div>
  </div>

  <script>
    const modalOverlay = document.getElementById("modalOverlay");
    const openModalButton = document.getElementById("openModalButton");
    const closeModalButton = document.getElementById("closeModalButton");

    function openModal() {
      modalOverlay.classList.add("is-open");
      modalOverlay.setAttribute("aria-hidden", "false");
    }

    function closeModal() {
      modalOverlay.classList.remove("is-open");
      modalOverlay.setAttribute("aria-hidden", "true");
    }

    openModalButton.addEventListener("click", openModal);
    closeModalButton.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (event) => {
      if (event.target === modalOverlay) {
        closeModal();
      }
    });

    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModal();
      }
    });

    requestAnimationFrame(() => {
      requestAnimationFrame(openModal);
    });
  </script>
